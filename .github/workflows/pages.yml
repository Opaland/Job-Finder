# Déploie le site GitHub Pages : page d'accueil (site/) + démo interactive
# (frontend buildé en mode démo, données d'exemple embarquées).
# Le site est poussé sur la branche gh-pages, que GitHub Pages sert
# automatiquement. URL : https://opaland.github.io/Job-Finder/
name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/confident-ride-weseu3]
    paths:
      - 'site/**'
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances du frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Builder la démo
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: npx vite build --base=/Job-Finder/demo/ --outDir=dist-demo

      - name: Assembler le site (accueil + démo)
        run: |
          mkdir -p _site/demo
          cp -r site/. _site/
          cp -r frontend/dist-demo/. _site/demo/
          touch _site/.nojekyll

      - name: Publier sur la branche gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Déploiement du site (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
