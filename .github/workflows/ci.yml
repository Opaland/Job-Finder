# Tests backend + build frontend à chaque push.
name: CI

on:
  push:
    branches: [main, claude/confident-ride-weseu3]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

      # Même vérification que scripts/verif.sh : une route non simulée dans
      # demoApi.js ne doit pas casser la démo GitHub Pages.
      - name: Build démo
        working-directory: frontend
        run: VITE_DEMO=1 npx vite build --base=/Job-Finder/demo/ --outDir=dist-demo
