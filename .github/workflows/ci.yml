# Tests backend + build frontend à chaque push.
name: CI

on:
  push:
    branches: [main, claude/confident-ride-weseu3]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt
      # Les tests d'accès aux fichiers ne s'exécutent que si une interface est
      # présente (ils comparent chaque réponse au vrai index.html). Le job
      # backend ne builde pas le frontend : les 7 tests de régression de la
      # traversée de chemin — celle qui servait la base de données entière —
      # étaient donc silencieusement ignorés en CI. Une interface minimale
      # suffit : ce qu'ils vérifient, c'est le confinement, pas le contenu.
      - name: Interface minimale (tests d'accès aux fichiers)
        run: |
          mkdir -p frontend/dist/assets
          echo '<!doctype html><title>Job Finder</title>' > frontend/dist/index.html
          echo 'body{}' > frontend/dist/assets/index.css

      # `-rs` : afficher la RAISON de chaque test ignoré. Depuis que la suite
      # appelle les vraies sources, un test peut être ignoré parce qu'un site
      # bloque le runner — sans cette option, la CI serait verte sans dire ce
      # qu'elle n'a pas vérifié, ce qui est précisément le piège qu'on combat.
      - name: Tests
        working-directory: backend
        run: python -m pytest tests/ -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

      # Même vérification que scripts/verif.sh : une route non simulée dans
      # demoApi.js ne doit pas casser la démo GitHub Pages.
      - name: Build démo
        working-directory: frontend
        run: VITE_DEMO=1 npx vite build --base=/Job-Finder/demo/ --outDir=dist-demo
